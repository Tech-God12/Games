<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS VEIL : SECTOR 9 // EXTRACTION PROTOCOL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; width: 100%; height: 100%; background: #06080f; font-family: 'JetBrains Mono', monospace; }
    #canvas-container { position: fixed; inset: 0; }
    #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #loading { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #151a2e 0%, #06080f 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(2rem, 6vw, 4rem); color: #fff; letter-spacing: 0.15em; text-shadow: 0 0 40px #5a7cff, 0 0 80px #5a7cff44; line-height: 0.9; text-align: center; }
    .logo span { display: block; font-size: 0.35em; font-weight: 400; letter-spacing: 0.5em; color: #8aa0ff; margin-top: 0.5em; }
    .loading-bar { width: 320px; height: 2px; background: #1a1f3a; margin-top: 3rem; position: relative; overflow: hidden; }
    .loading-fill { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, #5a7cff, #a78bff); box-shadow: 0 0 10px #5a7cff; transition: width 0.2s; }
    .loading-text { margin-top: 1rem; font-size: 11px; letter-spacing: 0.2em; color: #5a6aaa; text-transform: uppercase; }
    .scanline { position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(90,124,255,0.03) 2px, rgba(90,124,255,0.03) 4px); pointer-events: none; z-index: 50; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">NEXUS VEIL<div style="font-size:0.6em; margin-top:0.2em">SECTOR 9</div><span>EXTRACTION PROTOCOL VER 0.9.7</span></div>
    <div class="loading-bar"><div class="loading-fill" id="load-fill"></div></div>
    <div class="loading-text" id="load-text">INITIALIZING NEURAL LINK...</div>
  </div>
  <div id="canvas-container"></div>
  <div id="ui-root"></div>
  <div class="scanline"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
